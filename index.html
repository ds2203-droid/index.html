<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID Community</title>
<style>
:root{color-scheme:dark;--bg:#10171c;--panel:#202b31;--side:#172228;--line:#304148;--text:#e6f3ef;--muted:#93aaa4;--green:#18e6a0;--red:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.top{height:60px;display:flex;align-items:center;gap:16px;padding:0 22px;background:#0b1216;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.brand{font:900 22px ui-monospace,monospace;letter-spacing:2px;color:var(--green)}.brand span{color:white}.topstatus{margin-left:auto;color:var(--green);font-size:11px}.top button,.btn{border:1px solid var(--green);background:var(--green);color:#06140f;padding:9px 13px;border-radius:5px;font-weight:800}.btn.alt,.top button.alt{background:transparent;color:var(--green)}.app{display:grid;grid-template-columns:58px 205px minmax(0,1fr);height:calc(100vh - 60px);min-height:500px;max-width:1500px;margin:auto;border-inline:1px solid var(--line)}.rail{background:#10191f;display:flex;align-items:center;flex-direction:column;gap:10px;padding:12px 6px;border-right:1px solid var(--line)}.rail button{width:40px;height:40px;border:0;border-radius:12px;background:#26383e;color:var(--green);font-weight:900}.rail button:hover{background:var(--green);color:#04110d}.side{background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}.sidehead{padding:17px 12px;border-bottom:1px solid var(--line);font-weight:900;font-size:12px}.sidehead small{display:block;color:var(--muted);font-weight:400;margin-top:5px}.label{padding:16px 10px 6px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}.rooms{padding:0 6px;display:grid;gap:3px}.room{width:100%;border:0;text-align:left;background:transparent;color:#a8b9b4;padding:9px;border-radius:5px}.room:before{content:'#';font-size:16px;color:#78918a;margin-right:8px}.room.active,.room:hover{background:#2b3b41;color:white}.profile{margin-top:auto;border-top:1px solid var(--line);padding:12px;display:flex;gap:9px;align-items:center}.avatar{width:35px;height:35px;flex:0 0 35px;display:grid;place-items:center;background:#14513f;color:#72ffcb;border-radius:8px;font-weight:900}.muted{color:var(--muted);font-size:11px}.workspace{min-width:0;display:flex;flex-direction:column;background:var(--panel)}.workhead{display:flex;align-items:center;gap:9px;padding:14px 17px;min-height:60px;border-bottom:1px solid var(--line)}.workhead .hash{font-size:22px;color:var(--muted)}.workhead small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:11px;padding:7px 9px}.tabs{display:flex;gap:7px;padding:10px 16px;border-bottom:1px solid var(--line);overflow:auto}.tabs button{border:1px solid var(--line);background:#172228;color:#b8c9c3;border-radius:5px;padding:7px 10px;white-space:nowrap}.tabs button.active{border-color:var(--green);color:var(--green)}.content{flex:1;min-height:0;overflow:auto;padding:16px}.welcome{padding:18px;border-bottom:1px solid var(--line);background:#19252a}.welcome h2{margin:0 0 8px;font-size:18px}.welcome p{color:#b1c2bd;line-height:1.6;margin:0;font-size:13px}.compose{display:flex;gap:8px;margin-bottom:16px}.compose textarea{flex:1;min-width:0;resize:vertical;min-height:65px}.field{width:100%;background:#111a1e;color:var(--text);border:1px solid #3a5355;border-radius:5px;padding:11px;outline:none}.field:focus{border-color:var(--green)}.post{border-bottom:1px solid var(--line);padding:16px 0}.posthead{display:flex;gap:9px;align-items:center}.postbody{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;margin:10px 0;color:#d3e2dd}.postactions{display:flex;gap:12px}.linkbtn{background:none;border:0;color:var(--muted);padding:0;font-size:12px}.linkbtn:hover{color:var(--green)}.messages{display:flex;flex-direction:column;gap:14px;padding:14px 0}.message{display:flex;gap:9px}.message .text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.message time{font-size:10px;color:var(--muted);margin-left:8px}.composer{display:flex;gap:8px;padding:12px;background:#27363c;border-radius:7px;margin:0 13px 13px}.composer input{flex:1;min-width:0;background:transparent;border:0;color:white;outline:0}.card{max-width:600px;border:1px solid var(--line);background:#172329;padding:17px;border-radius:8px;margin:10px auto}.card h3{margin:0 0 8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}.row:last-child{border:0}.row button{padding:7px 9px}.overlay{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.modal{width:min(420px,100%);padding:22px;background:#111e23;border:1px solid #41645b;border-radius:8px}.modal h2{margin:0 0 8px}.modal p{font-size:12px;line-height:1.6;color:var(--muted)}.modal form{display:grid;gap:10px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--green);color:#04110d;padding:11px 16px;border-radius:5px;font-weight:800;z-index:20;display:none;max-width:90vw}.toast.show{display:block}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.admin{border:1px solid #5b6a43;padding:14px;border-radius:7px;margin-bottom:14px}.danger{color:var(--red)}@media(max-width:760px){.app{grid-template-columns:42px 132px minmax(0,1fr)}.rail{padding:8px 3px}.rail button{width:33px;height:33px}.sidehead{font-size:10px;padding:12px 6px}.room{font-size:11px;padding:8px 5px}.workhead{padding:9px}.workhead strong{font-size:12px}.actions button{padding:6px;font-size:10px}.content{padding:10px}.composer{margin:0 5px 6px}.welcome{padding:12px}.top{padding:0 12px}.brand{font-size:19px}}@media(max-width:520px){.app{grid-template-columns:38px 104px minmax(0,1fr)}.sidehead small{font-size:8px}.room{font-size:10px}.tabs{padding:8px}.tabs button{font-size:10px;padding:6px}.workhead small{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
</style></head><body>
<header class="top"><div class="brand">VOID<span>_</span></div><span class="topstatus" id="connection">● 연결 준비 중</span><button class="alt" id="accountButton">로그인 / 가입</button></header>
<div class="app"><nav class="rail"><button title="VOID">V</button><button id="newRoom" title="방 만들기">＋</button><button id="adminButton" title="운영자 도구">⚙</button></nav><aside class="side"><div class="sidehead">VOID COMMUNITY<small>공용 커뮤니티 서버</small></div><div class="label">시작하기</div><div class="rooms" id="baseRooms"></div><div class="label">일반 채팅</div><div class="rooms" id="customRooms"></div><div class="label">계정</div><div class="profile"><div class="avatar" id="avatar">?</div><div style="min-width:0"><div id="profileName">게스트</div><div class="muted" id="profileStatus">로그인 필요</div></div></div></aside>
<section class="workspace"><div class="workhead"><span class="hash">#</span><div><strong id="roomName">피드</strong><small id="roomDescription">커뮤니티 소식과 채팅</small></div><div class="actions"><button class="btn alt" id="refresh">새로고침</button><button class="btn alt" id="requestAccess">인증 신청</button></div></div><div class="tabs"><button class="active" data-view="feed">커뮤니티 피드</button><button data-view="chat">채팅</button><button data-view="requests" id="requestTab" hidden>인증 신청 관리</button><button data-view="users" id="usersTab" hidden>회원 관리</button></div><div class="content" id="content"><div class="empty">서버에 연결하는 중...</div></div><form class="composer" id="chatComposer"><input id="chatInput" maxlength="500" placeholder="메시지 입력..." autocomplete="off"><button class="btn" id="sendChat">전송 ↗</button></form></section></div>
<div class="overlay" id="authOverlay"><div class="modal"><h2 id="authTitle">VOID 계정</h2><p>계정은 공용 데이터베이스에 저장됩니다. 다른 사람과 비밀번호를 공유하지 마세요.</p><form id="authForm"><input class="field" id="authName" maxlength="20" required placeholder="닉네임 (2~20자)" autocomplete="username"><input class="field" id="authPassword" type="password" minlength="8" maxlength="128" required placeholder="비밀번호 (8자 이상)" autocomplete="current-password"><input class="field" id="authAdminKey" type="password" placeholder="관리자 코드 (관리자 가입 시 필요)" autocomplete="off" hidden><button class="btn" id="authSubmit">로그인</button><button class="btn alt" type="button" id="switchAuth">회원가입으로 전환</button><button class="btn alt" type="button" id="closeAuth">닫기</button></form></div></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('void_token')||'',user=null,state=null,view='feed',roomId='lobby',authMode='login',poll=null;const baseIds=['verify','notice','promotion'];
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function call(action,p={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{if(!r||!r.ok){reject(new Error(r&&r.error||'요청에 실패했습니다.'));return}resolve(r)}).withFailureHandler(e=>reject(new Error(e&&e.message||String(e)))).api(action,{...p,token}));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(s){return Array.from(s||'?').slice(0,2).join('').toUpperCase()}function time(s){try{return new Date(s).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(_){return ''}}
function isAdmin(){return user&&user.role==='admin'}function isStaff(){return user&&(user.role==='admin'||user.role==='staff')}function approved(){return state&&(state.approved||isStaff())}function currentRoom(){return state?.rooms?.find(r=>r.id===roomId)||{id:'lobby',name:'일반방',description:'편하게 이야기 나누는 공간',kind:'approved'}}
async function refresh(){if(!token){renderLoggedOut();return}try{state=await call('state');user=state.user;$('connection').textContent='● 서버 연결됨';$('connection').style.color='var(--green)';renderAll()}catch(e){if(/로그인이 만료/.test(e.message)){token='';sessionStorage.removeItem('void_token');user=null;renderLoggedOut()}else toast(e.message)}}
function renderLoggedOut(){$('connection').textContent='● 로그인 필요';$('connection').style.color='var(--muted)';$('profileName').textContent='게스트';$('profileStatus').textContent='로그인 필요';$('avatar').textContent='?';$('accountButton').textContent='로그인 / 가입';$('requestAccess').hidden=true;$('requestAccess').style.display='none';$('requestTab').hidden=true;$('usersTab').hidden=true;$('baseRooms').innerHTML='<button class="room active" data-room="verify">인증방</button><button class="room" data-room="notice">공지사항</button><button class="room" data-room="promotion">승급 요청방</button>'; $('customRooms').innerHTML='';$('content').innerHTML='<div class="welcome"><h2>YOUR VOICE. YOUR VOID.</h2><p>친구들과 함께 사용하는 VOID 커뮤니티에 오신 걸 환영합니다. 로그인하거나 가입한 뒤 인증을 신청해 주세요.</p></div><div class="card"><h3>계정이 필요합니다</h3><p class="muted">회원가입 후 운영자 승인을 받으면 커뮤니티 게시물과 채팅방을 이용할 수 있습니다.</p><button class="btn" id="loginPrompt">로그인 / 가입하기</button></div>'; $('loginPrompt').onclick=openAuth;$('chatComposer').style.display='none';}
function renderAll(){if(!state)return;$('profileName').textContent=user.name;$('profileStatus').textContent=isAdmin()?'관리자':user.role==='staff'?'간부':approved()?'인증 완료':'인증 대기';$('avatar').textContent=initials(user.name);$('accountButton').textContent='로그아웃';$('requestAccess').style.display=approved()?'none':'inline-block';$('requestAccess').hidden=approved();$('requestTab').hidden=!isStaff();$('usersTab').hidden=!isAdmin();const base=state.rooms.filter(r=>baseIds.includes(r.id));const custom=state.rooms.filter(r=>!baseIds.includes(r.id));$('baseRooms').innerHTML=base.map(roomButton).join('');$('customRooms').innerHTML=custom.map(roomButton).join('');document.querySelectorAll('[data-room]').forEach(b=>b.classList.toggle('active',b.dataset.room===roomId));$('chatComposer').style.display=view==='chat'?'flex':'none';$('roomName').textContent=view==='feed'?'커뮤니티 피드':view==='requests'?'인증 신청 관리':view==='users'?'회원 관리':currentRoom().name;$('roomDescription').textContent=view==='feed'?'게시물 작성과 좋아요':view==='chat'?currentRoom().description:'운영자 도구';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='feed')renderFeed();else if(view==='chat')renderMessages();else if(view==='requests')renderRequests();else if(view==='users')renderUsers()}
function roomButton(r){return '<button class="room" data-room="'+esc(r.id)+'">'+esc(r.name)+(r.kind==='staff'?' 🔒':'')+'</button>'}
function renderFeed(){const can=approved();let html='<div class="welcome"><h2>YOUR VOICE. YOUR VOID.</h2><p>생각을 공유하고 친구들과 아이디어를 나눠 보세요. 새 게시물은 접속한 모든 사용자에게 공유됩니다.</p></div>';if(can)html+='<div class="compose"><textarea id="postText" class="field" maxlength="600" placeholder="지금 무슨 생각을 하고 있어? (최대 600자)"></textarea><button class="btn" id="publish">게시</button></div>';else html+='<div class="card"><h3>인증이 필요합니다</h3><p class="muted">운영자의 승인을 받으면 게시물 작성과 채팅을 이용할 수 있어요.</p><button class="btn" id="feedRequest">인증 신청</button></div>';const posts=state.posts||[];html+=posts.length?posts.map(p=>'<article class="post"><div class="posthead"><div class="avatar">'+esc(initials(p.name))+'</div><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(time(p.createdAt))+'</div></div></div><div class="postbody">'+esc(p.text)+'</div><div class="postactions"><button class="linkbtn" data-like="'+esc(p.id)+'">'+(p.liked?'♥':'♡')+' '+Number(p.likes||0)+' 좋아요</button>'+(p.mine||isAdmin()?'<button class="linkbtn danger" data-delete-post="'+esc(p.id)+'">삭제</button>':'')+'</div></article>').join(''):'<div class="empty">아직 게시물이 없습니다.</div>';$('content').innerHTML=html;$('publish')?.addEventListener('click',async()=>{try{await call('post',{text:$('postText').value});toast('게시물을 올렸습니다.');await refresh()}catch(e){toast(e.message)}});$('feedRequest')?.addEventListener('click',requestAccess);$('content').querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{try{await call('like',{id:b.dataset.like});await refresh()}catch(e){toast(e.message)}});$('content').querySelectorAll('[data-delete-post]').forEach(b=>b.onclick=async()=>{if(!confirm('이 게시물을 삭제할까요?'))return;try{await call('deletePost',{id:b.dataset.deletePost});await refresh();toast('삭제했습니다.')}catch(e){toast(e.message)}})}
function renderMessages(){const r=currentRoom();if(r.kind!=='public'&&!approved()&&!isStaff()){$('content').innerHTML='<div class="card"><h3>인증 승인이 필요합니다</h3><p class="muted">운영자의 인증 승인을 받은 뒤 이 방에 들어올 수 있습니다.</p><button class="btn" id="chatRequest">인증 신청</button></div>';$('chatRequest').onclick=requestAccess;return}if(r.kind==='staff'&&!isStaff()){$('content').innerHTML='<div class="card"><h3>🔒 간부 전용 방</h3><p class="muted">간부 권한이 있는 사용자만 이용할 수 있습니다.</p></div>';return}const msgs=(state.messages||[]).filter(m=>m.roomId===roomId);$('content').innerHTML='<div class="messages">'+(msgs.length?msgs.map(m=>'<div class="message"><div class="avatar">'+esc(initials(m.name))+'</div><div><b>'+esc(m.name)+'</b><time>'+esc(time(m.createdAt))+'</time><div class="text">'+esc(m.text)+'</div></div></div>').join(''):'<div class="empty">첫 메시지를 보내 보세요.</div>')+'</div>';$('content').scrollTop=$('content').scrollHeight}
function renderRequests(){if(!isStaff()){view='feed';renderAll();return}const list=state.requests||[];$('content').innerHTML='<div class="welcome"><h2>인증 신청 관리</h2><p>신청 내용을 확인한 뒤 승인할 수 있습니다.</p></div>'+(list.length?list.map(r=>'<div class="row"><div><b>'+esc(r.name)+'</b><div class="muted">'+esc(r.reason)+' · '+esc(time(r.createdAt))+'</div></div><button class="btn" data-approve="'+esc(r.id)+'">승인</button></div>').join(''):'<div class="empty">대기 중인 신청이 없습니다.</div>');$('content').querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{try{await call('approve',{id:b.dataset.approve});toast('인증을 승인했습니다.');await refresh()}catch(e){toast(e.message)}})}
function renderUsers(){if(!isAdmin())return;const list=state.users||[];$('content').innerHTML='<div class="welcome"><h2>회원 관리</h2><p>권한은 필요한 사용자에게만 부여하세요.</p></div>'+list.map(u=>'<div class="row"><div><b>'+esc(u.name)+'</b><div class="muted">'+esc(u.role)+' · '+(u.approved?'인증 완료':'인증 대기')+'</div></div><select class="field" style="width:auto" data-role="'+esc(u.id)+'"><option value="member" '+(u.role==='member'?'selected':'')+'>회원</option><option value="staff" '+(u.role==='staff'?'selected':'')+'>간부</option><option value="admin" '+(u.role==='admin'?'selected':'')+'>관리자</option></select></div>').join('');$('content').querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{try{await call('setRole',{userId:s.dataset.role,role:s.value});toast('권한을 변경했습니다.');await refresh()}catch(e){toast(e.message);await refresh()}})}
function openAuth(mode='login'){authMode=mode;$('authTitle').textContent=mode==='login'?'VOID 로그인':'VOID 회원가입';$('authSubmit').textContent=mode==='login'?'로그인':'회원가입';$('switchAuth').textContent=mode==='login'?'회원가입으로 전환':'로그인으로 전환';$('authPassword').autocomplete=mode==='login'?'current-password':'new-password';$('authAdminKey').hidden=mode!=='register'||$('authName').value.trim()!=='결석';$('authOverlay').classList.add('open')}
$('authName').addEventListener('input',()=>{$('authAdminKey').hidden=authMode!=='register'||$('authName').value.trim()!=='결석'});
$('switchAuth').onclick=()=>openAuth(authMode==='login'?'register':'login');$('closeAuth').onclick=()=>$('authOverlay').classList.remove('open');$('authOverlay').onclick=e=>{if(e.target===$('authOverlay'))$('authOverlay').classList.remove('open')};$('authForm').onsubmit=async e=>{e.preventDefault();try{const r=await call(authMode,{name:$('authName').value,password:$('authPassword').value,adminKey:$('authAdminKey').value});token=r.token;sessionStorage.setItem('void_token',token);user=r.user;$('authPassword').value='';$('authAdminKey').value='';$('authAdminKey').hidden=true;$('authOverlay').classList.remove('open');await refresh();toast(authMode==='login'?'로그인했습니다.':'가입 완료! 인증을 신청해 주세요.')}catch(err){toast(err.message)}};
$('accountButton').onclick=async()=>{if(!token){openAuth();return}if(!confirm('로그아웃할까요?'))return;try{await call('logout');}catch(_){}token='';user=null;state=null;sessionStorage.removeItem('void_token');renderLoggedOut()};async function requestAccess(){if(!token){openAuth();return}const reason=prompt('인증 신청 사유 (선택)','커뮤니티 이용 신청');if(reason===null)return;try{await call('request',{reason:reason||'커뮤니티 이용 신청'});toast('인증 신청을 보냈습니다.');await refresh()}catch(e){toast(e.message)}}$('requestAccess').onclick=requestAccess;$('refresh').onclick=refresh;
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view==='chat'&&!roomId)roomId='lobby';renderAll()});document.addEventListener('click',e=>{const b=e.target.closest('[data-room]');if(!b)return;roomId=b.dataset.room;view='chat';renderAll()});$('chatComposer').onsubmit=async e=>{e.preventDefault();const input=$('chatInput'),text=input.value.trim();if(!text)return;try{await call('message',{roomId,text});input.value='';await refresh();input.focus()}catch(err){toast(err.message)}};$('newRoom').onclick=async()=>{if(!isStaff()){toast('운영진만 채팅방을 만들 수 있습니다.');return}const name=prompt('새 채팅방 이름');if(!name)return;const staffOnly=confirm('간부 전용 방으로 만들까요? 확인=간부 전용, 취소=인증 회원용');try{const r=await call('addRoom',{name,staffOnly});roomId=r.id;view='chat';await refresh();toast('채팅방을 만들었습니다.')}catch(e){toast(e.message)}};$('adminButton').onclick=()=>{if(isAdmin()){view='users';renderAll()}else if(isStaff()){view='requests';renderAll()}else toast('운영자 권한이 필요합니다.')};
if(token){refresh();poll=setInterval(refresh,5000)}else renderLoggedOut();})();
</script></body></html>
